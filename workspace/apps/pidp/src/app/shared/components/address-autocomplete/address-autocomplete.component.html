<div class="address-autocomplete" uiPidpInjectViewportCss [formGroup]="form">
  <div>
    <label for="address-autocomplete" id="address-autocomplete-address-label">Address</label>
    <mat-form-field class="w-100">
      <input
        id="address-autocomplete"
        matInput
        role="presentation"
        autocomplete="off"
        formControlName="autocomplete"
        aria-labelledby="address-autocomplete-address-label"
        [matAutocomplete]="auto" />
        <mat-autocomplete #auto="matAutocomplete" autocomplete="off">
          @for (field of addressAutocompleteFields; track field) {
            <mat-option
              [value]="field.text"
              tabindex="0" (keydown.enter)="onAutocomplete(field.id)" (click)="onAutocomplete(field.id)">
              {{ field.text }} {{ field.description }}
            </mat-option>
          }
        </mat-autocomplete>
        <mat-hint>
          Start with unit number and street number. Address autocompleted by
          <a uiAnchor [attr.href]="canadaPostUrl" aria-label="link">Canada Post</a>
        </mat-hint>
      </mat-form-field>
    </div>
    <div>
      <ng-content></ng-content>
    </div>
  </div>
