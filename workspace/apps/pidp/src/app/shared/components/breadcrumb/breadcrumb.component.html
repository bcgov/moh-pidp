<div class="breadcrumb-container" uiPidpInjectViewportCss>
  <nav class="breadcrumb">
    <ul>
      @for (
        breadcrumb of breadcrumbs; track
        breadcrumb; let itemIndex = $index; let isFirstItem = $first; let isLastItem = $last) {
        <li
          >
          <button
            uiTextButton
            [disabled]="isLastItem"
            tabindex="0" (keydown.enter)="isFirstItem ? onBack() : navigateTo(breadcrumb.path)" (click)="isFirstItem ? onBack() : navigateTo(breadcrumb.path)">
            @if (isFirstItem) {
              <img
                src="/assets/images/icons/icon-home.svg"
                alt="Home" />
            }
            <span [ngClass]="{ 'home-text': isFirstItem }">{{
              breadcrumb.title
            }}</span>
          </button>
          @if (!isLastItem) {
            <fa-icon
              class="fa-duotone"
            [icon]="faAngleRight"></fa-icon>
          }
        </li>
      }
    </ul>
  </nav>
</div>
