<mat-radio-group (change)="onDecisionUpdate($event)">
  @for (decision of decisions; track decision) {
  <mat-radio-button [value]="decision.code">
    {{ decision.name }}
  </mat-radio-button>
  }
</mat-radio-group>

<ng-template #content>
  <ng-content></ng-content>
</ng-template>

@if (chosenDecision) {
<div>
  <ng-container *ngTemplateOutlet="content"></ng-container>
</div>
}
