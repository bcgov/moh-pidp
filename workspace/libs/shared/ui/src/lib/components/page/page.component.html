<ui-overlay>
  <div [class]="mode">
    @if (form) {
      <form
        novalidate
        [autocomplete]="autocomplete"
        [formGroup]="form"
        (ngSubmit)="onSubmit()">
        <ng-container *ngTemplateOutlet="pageContent"></ng-container>
      </form>
    } @else {
      <ng-content></ng-content>
    }
  </div>
</ui-overlay>

<ng-template #pageContent>
  <ng-content></ng-content>
</ng-template>
