<ng-template #contentSlot>
  <ng-content select="[uiAlertContent]"></ng-content>
</ng-template>
<ng-template #actionsSlot>
  <ng-content select="[uiAlertActions]"></ng-content>
</ng-template>
<ui-card [icon]="icon" [iconType]="iconType" [heading]="heading" [class]="{
    'ui-card-alert': true,
    indent: true,
    success: type === 'success',
    info: type === 'info',
    warn: type === 'warn',
    danger: type === 'danger',
    muted: type === 'muted'
  }">
  @if (alertContent.length) {
  <ng-container uiCardContent>
    <ng-container *ngTemplateOutlet="contentSlot"></ng-container>
  </ng-container>
  }
  @if (alertActions.length) {
  <ng-container uiCardActions>
    <ng-container *ngTemplateOutlet="actionsSlot"></ng-container>
  </ng-container>
  }
</ui-card>
