<div>
  <ng-content></ng-content>

  @if (loading$ | async; as loading) {
    <div
      class="overlay"
      [class.cover-viewport]="loading.withMessage">
      @if (loading.withMessage) {
        <div>
          <span>
            <mat-spinner diameter="50"></mat-spinner>
          </span>
          <span>
            <p>{{ message }}</p>
          </span>
        </div>
      }
    </div>
  }
</div>
