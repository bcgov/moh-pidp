<div tabindex="0" (keydown.enter)="toggleTooltip()" (click)="toggleTooltip()">
  @if (showTooltip) {
    <div class="tooltip-container">
      <button class="close-button">
        <mat-icon>{{ icon }}</mat-icon>
      </button>
      <p>
        {{ tooltipText }}
      </p>
      <button class="action-button" tabindex="0" (keydown.enter)="onAction()" (click)="onAction()">
        <strong>{{ buttonLabel }}</strong>
      </button>
      <ng-content></ng-content>
    </div>
  }
</div>
