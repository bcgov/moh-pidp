<div class="toggle-container">
  <mat-slide-toggle [color]="color" [checked]="checked" (change)="onToggleContent($event)">
    {{ label }}
  </mat-slide-toggle>

  <ng-template #content>
    <ng-content></ng-content>
  </ng-template>

  @if (checked) {
  <div class="toggle-content">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </div>
  }
</div>
