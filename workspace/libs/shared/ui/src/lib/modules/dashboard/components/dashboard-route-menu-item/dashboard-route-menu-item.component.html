<mat-list-item
  routerLinkActive="ng-active"
  [routerLink]="routeMenuItem.commands"
  [routerLinkActiveOptions]="routeMenuItem.linkActiveOptions"
  [fragment]="routeMenuItem.extras.fragment"
  [class]="routeMenuItem.getOptions()"
  tabindex="0" (keydown.enter)="onRoute(routeMenuItem)" (click)="onRoute(routeMenuItem)">
  @if ({
    isDesktop: isDesktopAndUpBreakpoint$ | async
    }; as breakpoint) {
    @if (showMenuItemIcons) {
      <mat-icon
        mat-list-icon
      [class.center-sidenav-icon]="
        responsiveMenuItems && !breakpoint.isDesktop
      ">
        {{ routeMenuItem.icon }}
      </mat-icon>
    }
    <a
      matLine
      [class.extend-content-width]="
        !responsiveMenuItems || breakpoint.isDesktop
      " aria-label="link">
      @if (!responsiveMenuItems || breakpoint.isDesktop) {
        <span>
          {{ routeMenuItem.label }}
        </span>
      }
    </a>
  }
</mat-list-item>
