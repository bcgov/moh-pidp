<mat-toolbar [class.theme-light]="theme === 'light'">
  @if (allowMobileToggle && (mobileToggleBreakpoint$ | async)) {
    <span>
      <button mat-icon-button aria-label="open" (click)="onOpenMenu()">
        <mat-icon>menu</mat-icon>
      </button>
    </span>
  }
  <span>
    <ui-bc-gov-logo [theme]="theme"></ui-bc-gov-logo>
  </span>

  <span class="flex-fill"></span>

  @if (username && (usernameBreakpoint$ | async)) {
    <span class="username">
      {{ username }}
    </span>
  }
  @if (username) {
    <span class="logout">
      <button
        mat-icon-button
        matTooltip="Logout"
        aria-label="logout"
        (click)="onLogout()">
        <mat-icon>logout</mat-icon>
      </button>
    </span>
  }
</mat-toolbar>

<div class="ngx-progress">
  <ng-progress></ng-progress>
</div>
