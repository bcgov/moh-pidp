appName: midas-probe
licensePlate: f088b1
imageStreamTag: latest
replicas: 1
dockerhost: image-registry.openshift-image-registry.svc:5000
environment: "prod"
cluster: "GOLD"
gslb_host: "healthprovideridentityportal.gov.bc.ca.glb.gov.bc.ca"
resources:
  requests:
    cpu: 20m
    memory: 50Mi


# fluentbit must be enabled for prod environment
fluentbit:
  enabled: false
  imageRegistry: docker.io/fluent/fluent-bit:3.0.3-debug
  imagePullPolicy: IfNotPresent
  # The value of slack_webhook parameter is read from secret `slack-error-notification-webhook` (key `url`) by default, or can be overridden here.
  slack_webhook: ""
  secret:
    name: "slack-error-notification-webhook"
    key: "url"
  securityContext:
    enabled: false
    runAsUser: 1001
  resources:
    requests:
      cpu: 10m
      memory: 16Mi