{{- $secretName := include "metabase.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}
  {{- $existingData = $existing.data | default dict }}
{{- end }}
{{- $dbPass := .Values.database.password | default (ternary (index $existingData "database-password" | default "" | b64dec) "" (hasKey $existingData "database-password")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "metabase.labels" . | nindent 4 }}
  annotations:
    template.openshift.io/expose-databae-host: '{.data[''database-host'']}'
    template.openshift.io/expose-database_name: '{.data[''database-name'']}'
    template.openshift.io/expose-username: '{.data[''database-username'']}'
    template.openshift.io/expose-password: '{.data[''database-password'']}'

stringData:
  database-host: {{ .Values.database.host | quote }}
  database-name: {{ .Values.database.name | quote }}
  database-username: {{ .Values.database.username | quote }}
  database-password: {{ $dbPass | quote }}