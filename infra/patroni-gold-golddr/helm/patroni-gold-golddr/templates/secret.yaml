{{- $secretName := printf "%s-%s-secret" .Values.environment .Values.app_name }}
{{- $secretNs := printf "%s-%s" .Values.license_plate .Values.environment }}
{{- $existing := lookup "v1" "Secret" $secretNs $secretName }}
{{- $existingData := dict }}
{{- if $existing }}
  {{- $existingData = $existing.data | default dict }}
{{- end }}
{{- $replPass := .Values.replication_password | default (ternary (index $existingData "replication-password" | default "" | b64dec) "" (hasKey $existingData "replication-password")) }}
{{- $rootPass := .Values.root_password | default (ternary (index $existingData "superuser-password" | default "" | b64dec) "" (hasKey $existingData "superuser-password")) }}
{{- $appPass := .Values.app_db_password | default (ternary (index $existingData "app-db-password" | default "" | b64dec) "" (hasKey $existingData "app-db-password")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $secretNs }}
  labels:
    {{- include "chart.common-labels" . }}
stringData:
  replication-username: replication
  replication-password: {{ $replPass | quote }}
  superuser-username: postgres
  superuser-password: {{ $rootPass | quote }}
  app-db-name: {{ .Values.app_db_name | quote }}
  app-db-username: {{ .Values.app_db_username | quote }}
  app-db-password: {{ $appPass | quote }}