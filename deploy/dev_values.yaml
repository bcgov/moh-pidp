# PR Helm values
global:
  vanityURL: "healthprovideridentityportal.gov.bc.ca"
  commit_sha: ""
  image:
    registry: image-registry.openshift-image-registry.svc:5000/f088b1-tools
    tag: develop
  license_plate: "f088b1"

database:
  autoCreate: false
  # databaseHost: dev-patroni
  # existingSecret: dev-patroni-secret

redis:
  enabled: false
  auth:
    existingSecret: redis
    existingSecretPasswordKey: database-password

nginx:
  image:
    registry: image-registry.openshift-image-registry.svc:5000/f088b1-tools
    repository: bitnami-nginx
    tag: 1.31.1
  metrics:
    enabled: false
    image:
      registry: image-registry.openshift-image-registry.svc:5000/f088b1-tools
      repository: bitnami-nginx-exporter
      tag: 1.5.1

frontend:
  replicaCount: 1
  settings:
    environmentName: dev
    keycloak:
      url: https://common-logon-dev.hlth.gov.bc.ca/auth

webapi:
  replicaCount: 1
  aspnetcore:
    environment: Staging
  corsAllowedOrigins: "https://dev.healthprovideridentityportal.gov.bc.ca"

plr-intake:
  replicaCount: 1

rabbitmq:
  autoCreate: true
  host: rabbitmq://pidp:password@rabbitmq:5672/

trivy:
  enabled: true